site_name: Notas Universidad

theme:
  name: "material"
  palette:
    # Modo oscuro - Azul más profundo
    - media: "(prefers-color-scheme: dark)"
      scheme: default
      primary: cyan
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Modo claro
    # Modo claro - Azul claro
    - media: "(prefers-color-scheme: light)"
      scheme: slate
      primary: light blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Modo oscuro# Extensions
markdown_extensions:
  - pymdownx.pathconverter:
      tags: "a script img link object embed"
  - attr_list
  - footnotes
  # - attr_list
  - pymdownx.arithmatex:
      generic: true
  # - pymdownx.superfences
  # - pymdownx.details
  # - pymdownx.magiclink
  - pymdownx.tasklist:
      custom_checkbox: true
  - def_list
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - toc:
      permalink: true

plugins:
  - mkdocs-pdf
  - search
  - roamlinks
  - blog
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid/dist/mermaid.min.js
extra_css:
  - stylesheets/extra.css
